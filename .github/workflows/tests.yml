name: Regression tests

on:
  pull_request:
    paths-ignore: ['legacy/**', '.github/workflows/legacy-tests.yml', '.github/workflows/release-legacy.yml']
  push:
    branches: ['**']
    paths-ignore: ['legacy/**', '.github/workflows/legacy-tests.yml', '.github/workflows/release-legacy.yml']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test and collect coverage
        run: >-
          dotnet test Trizbort.sln -c Release
          --logger "trx;LogFileName=regression.trx"
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --results-directory TestResults
      - name: Upload results and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
