name: Regression tests

on:
  pull_request:
    paths-ignore: ['legacy/**', '.github/workflows/legacy-tests.yml', '.github/workflows/release-legacy.yml']
  push:
    branches: ['**']
    paths-ignore: ['legacy/**', '.github/workflows/legacy-tests.yml', '.github/workflows/release-legacy.yml']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Tests in the InternalOnly category depend on timing (how long something takes, or a fixed wait being long
      # enough), which these shared, often busy machines can't give reliably. They're left out here; run them locally
      # with the rest (plain dotnet test runs everything).
      - name: Test and collect coverage
        run: >-
          dotnet test Trizbort.sln -c Release
          --filter "TestCategory!=InternalOnly"
          --logger "trx;LogFileName=regression.trx"
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --results-directory TestResults
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
      # (a test that hangs fails after 5 minutes, named in the log, rather than the job being cancelled at 15 with no
      # log at all)
      - name: Upload results and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
