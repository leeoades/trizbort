name: Release (Trizbort Recast)

# Releases of Trizbort Recast, the cross-platform Avalonia app.
# Tag format: recast-vMAJOR.MINOR.PATCH[.REVISION][-beta.N], e.g. recast-v0.9.0-beta.1.
# Changelog headings in the root changelog.md omit the prefix: ## [0.9.0-beta.1]
# Legacy WinForms hotfix releases use legacy-v* tags and release-legacy.yml.

on:
  push:
    tags:
      - 'recast-v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^recast-v(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?(-beta\.[1-9]\d*)?$') {
            throw "Release tag must be recast-vMAJOR.MINOR.PATCH[.REVISION], optionally followed by -beta.N (N >= 1)."
          }
          $prerelease = [bool]$Matches[5]
          $parts = @($Matches[1], $Matches[2], $Matches[3], $(if ($Matches[4]) { $Matches[4] } else { '0' }))
          foreach ($part in $parts) {
            if ([long]$part -gt 65534) { throw "Version components must be between 0 and 65534." }
          }
          $version = ($parts | ForEach-Object { [int]$_ }) -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          "informational=$($env:RELEASE_TAG.Substring(8))" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test Trizbort.sln -c Release

      - name: Publish and package
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_INFO: ${{ steps.version.outputs.informational }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $packageVersion = if ($env:RELEASE_PRERELEASE -eq 'true') { $env:RELEASE_INFO } else { $env:RELEASE_VERSION }
          $assets = @()
          foreach ($rid in 'win-x64', 'linux-x64') {
            $out = "publish/$rid"
            dotnet publish src/Trizbort.Avalonia/Trizbort.Avalonia.csproj -c Release -r $rid -o $out `
              --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:DebugType=none -p:Version=$env:RELEASE_VERSION -p:InformationalVersion=$env:RELEASE_INFO
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid." }
            Copy-Item LICENSE.txt, PdfSharp.License.txt -Destination $out
            if ($rid -like 'win-*') {
              Move-Item "$out/Trizbort.Avalonia.exe" "$out/TrizbortRecast.exe"
              $name = "TrizbortRecast-$packageVersion-$rid.zip"
              Compress-Archive -Path "$out/*" -DestinationPath $name
            } else {
              Move-Item "$out/Trizbort.Avalonia" "$out/trizbort-recast"
              chmod +x "$out/trizbort-recast"
              Copy-Item packaging/linux/trizbort.desktop, packaging/linux/trizbort-mime.xml -Destination $out
              $name = "TrizbortRecast-$packageVersion-$rid.tar.gz"
              tar -czf $name -C $out .
            }
            $assets += $name
          }
          "assets=$($assets -join ' ')" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_ASSETS: ${{ steps.package.outputs.assets }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG) + ($env:RELEASE_ASSETS -split ' ') + @(
            '--repo', $env:RELEASE_REPO, '--verify-tag', '--title', "Trizbort Recast $($env:RELEASE_TAG.Substring(8))", '--generate-notes')
          if ($env:RELEASE_PRERELEASE -eq 'true') {
            $heading = "## [$($env:RELEASE_TAG.Substring(8))]"
            $changelog = Get-Content 'changelog.md' -Raw
            $pattern = '(?ms)^' + [regex]::Escape($heading) + '[^\r\n]*\r?\n(.*?)(?=^## |\z)'
            $notes = [regex]::Match($changelog, $pattern)
            if (-not $notes.Success) { throw "No changelog entry found for $env:RELEASE_TAG." }
            Set-Content 'release-notes.md' $notes.Groups[1].Value.Trim() -Encoding utf8
            $releaseArgs += @('--prerelease', '--latest=false', '--notes-file', 'release-notes.md')
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }
