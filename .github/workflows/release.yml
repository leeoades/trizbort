name: "Release (Trizbort: Recast)"

# Releases of Trizbort: Recast, the cross-platform Avalonia app.
# Tag format: recast-vMAJOR.MINOR.PATCH[.REVISION][-beta[.N]], e.g. recast-v0.11.0-beta.
# Changelog headings in the root changelog.md omit the prefix: ## [0.9.0-beta.1]
# Legacy WinForms hotfix releases use legacy-v* tags and release-legacy.yml.
#
# Assets: Windows x64 zip, Linux x64 tar.gz, and macOS zips for Apple Silicon (arm64) and Intel (x64).
# The macOS apps are signed ad hoc only (no Apple Developer ID), so Gatekeeper asks before the first run.
#
# Updates: Velopack packages (vpk) for each channel - win-x64, linux-x64, osx-arm64, osx-x64 - are added to the
# same release. Installed copies (Setup.exe, the AppImage, the Mac app from the Velopack zip) find
# releases.<channel>.json there and update themselves. The plain zips and tar.gz stay portable.
# A tag with a fourth (revision) part isn't SemVer, so those releases ship without update packages.

on:
  push:
    tags:
      - 'recast-v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      informational: ${{ steps.version.outputs.informational }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      package: ${{ steps.version.outputs.package }}
      vpk: ${{ steps.version.outputs.vpk }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Determine version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^recast-v(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?(-beta(?:\.[1-9]\d*)?)?$') {
            throw "Release tag must be recast-vMAJOR.MINOR.PATCH[.REVISION], optionally followed by -beta or -beta.N (N >= 1)."
          }
          $prerelease = [bool]$Matches[5]
          $parts = @($Matches[1], $Matches[2], $Matches[3], $(if ($Matches[4]) { $Matches[4] } else { '0' }))
          foreach ($part in $parts) {
            if ([long]$part -gt 65534) { throw "Version components must be between 0 and 65534." }
          }
          $version = ($parts | ForEach-Object { [int]$_ }) -join '.'
          $informational = $env:RELEASE_TAG.Substring(8)
          "version=$version" >> $env:GITHUB_OUTPUT
          "informational=$informational" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "package=$(if ($prerelease) { $informational } else { $version })" >> $env:GITHUB_OUTPUT
          # Velopack needs SemVer 2 (three parts), e.g. 0.16.0-beta
          "vpk=$(if ($Matches[4]) { '' } else { $informational })" >> $env:GITHUB_OUTPUT

  macos:
    needs: version
    runs-on: macos-latest
    outputs:
      velopack: ${{ steps.velopack.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build app bundles
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_INFO: ${{ needs.version.outputs.informational }}
          PACKAGE_VERSION: ${{ needs.version.outputs.package }}
        run: |
          for rid in osx-arm64 osx-x64; do
            bash packaging/macos/make-app.sh "$rid" "$RELEASE_VERSION" "$RELEASE_INFO" "TrizbortRecast-$PACKAGE_VERSION-$rid.zip"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: macos-apps
          path: TrizbortRecast-*.zip
          if-no-files-found: error
          retention-days: 7

      # Not yet tested on a real Mac. If vpk fails, or its app no longer passes codesign,
      # the release still goes out with the zips above, just without Mac updates.
      - name: Velopack packages for updates
        id: velopack
        if: needs.version.outputs.vpk != ''
        continue-on-error: true
        env:
          VPK_VERSION: ${{ needs.version.outputs.vpk }}
          PACKAGE_VERSION: ${{ needs.version.outputs.package }}
          DOTNET_ROLL_FORWARD: Major
        run: |
          set -euo pipefail
          dotnet tool install -g vpk --version 1.2.161
          for rid in osx-arm64 osx-x64; do
            app="$(mktemp -d)"
            ditto -x -k "TrizbortRecast-$PACKAGE_VERSION-$rid.zip" "$app"
            # vpk adds its updater to the bundle, so it signs (ad hoc, "-") after: signing before isn't enough
            vpk pack -u TrizbortRecast -v "$VPK_VERSION" -c "$rid" -p "$app/Trizbort Recast.app" -e TrizbortRecast \
              --packTitle "Trizbort Recast" --icon packaging/icons/trizbort-recast.icns --noInst \
              --signAppIdentity "-" -o "velopack/$rid"
            check="$(mktemp -d)"
            ditto -x -k velopack/$rid/*Portable.zip "$check"
            codesign --verify --deep --strict "$check"/*.app
            # and the program inside the update package, which updates install. Only the program: a zip (the package)
            # doesn't keep the file attributes the .dll files' ad-hoc signatures are in, so the bundle's seal can't be
            # checked unpacked, but the program's own signature is inside it. Whether an update runs: try it on a Mac.
            unzip -q velopack/$rid/*-full.nupkg -d "$check/nupkg"
            codesign -dv "$check/nupkg/lib/app/Contents/MacOS/TrizbortRecast" 2>&1 | grep -q "Signature=adhoc"
          done
          ls -l velopack/*

      # A disk image of the same app (it updates itself too), the usual way to get a Mac app. If it can't be made,
      # the release still has the -Portable.zip (Lee, 27 Nov 2026).
      - name: Disk images
        if: steps.velopack.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          brew install create-dmg
          for rid in osx-arm64 osx-x64; do
            app="$(mktemp -d)"
            ditto -x -k velopack/$rid/*Portable.zip "$app"
            bash packaging/macos/make-dmg.sh "$(find "$app" -maxdepth 1 -name '*.app' | head -1)" "velopack/$rid/TrizbortRecast-$rid.dmg"
          done
          ls -l velopack/*/*.dmg

      - uses: actions/upload-artifact@v6
        if: steps.velopack.outcome == 'success'
        with:
          name: macos-velopack
          path: velopack/*/*
          if-no-files-found: error
          retention-days: 7

      - name: Note missing Mac updates
        if: steps.velopack.outcome == 'failure'
        run: echo "::warning::Mac Velopack packages failed, so this release has no Mac updates. See the step above."

  windows:
    needs: version
    if: needs.version.outputs.vpk != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Velopack package for updates (Setup.exe)
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_INFO: ${{ needs.version.outputs.informational }}
          VPK_VERSION: ${{ needs.version.outputs.vpk }}
          DOTNET_ROLL_FORWARD: Major
        run: |
          $out = 'publish/win-x64'
          dotnet publish src/Trizbort.Avalonia/Trizbort.Avalonia.csproj -c Release -r win-x64 -o $out `
            --self-contained true -p:PublishSingleFile=true `
            -p:DebugType=none -p:Version=$env:RELEASE_VERSION -p:InformationalVersion=$env:RELEASE_INFO
          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }
          Copy-Item LICENSE.txt, PdfSharp.License.txt -Destination $out
          Move-Item "$out/Trizbort.Avalonia.exe" "$out/TrizbortRecast.exe"
          dotnet tool install -g vpk --version 1.2.161
          vpk pack -u TrizbortRecast -v $env:VPK_VERSION -c win-x64 -p $out -e TrizbortRecast.exe `
            --packTitle "Trizbort Recast" --icon src/Trizbort.Avalonia/Assets/AppIcon/trizbort-recast.ico -o velopack/win-x64
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed." }
          Get-ChildItem velopack/win-x64

      - uses: actions/upload-artifact@v6
        with:
          name: windows-velopack
          path: velopack/win-x64/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, macos, windows]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.macos.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.windows.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # InternalOnly tests depend on timing; they're left out on the build server, as in tests.yml
      - name: Test
        run: dotnet test Trizbort.sln -c Release --filter "TestCategory!=InternalOnly"

      - name: Publish and package
        id: package
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_INFO: ${{ needs.version.outputs.informational }}
          PACKAGE_VERSION: ${{ needs.version.outputs.package }}
        run: |
          $assets = @()
          foreach ($rid in 'win-x64', 'linux-x64') {
            $out = "publish/$rid"
            dotnet publish src/Trizbort.Avalonia/Trizbort.Avalonia.csproj -c Release -r $rid -o $out `
              --self-contained true -p:PublishSingleFile=true `
              -p:DebugType=none -p:Version=$env:RELEASE_VERSION -p:InformationalVersion=$env:RELEASE_INFO
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid." }
            Copy-Item LICENSE.txt, PdfSharp.License.txt -Destination $out
            if ($rid -like 'win-*') {
              Move-Item "$out/Trizbort.Avalonia.exe" "$out/TrizbortRecast.exe"
              $name = "TrizbortRecast-$env:PACKAGE_VERSION-$rid.zip"
              Compress-Archive -Path "$out/*" -DestinationPath $name
            } else {
              Move-Item "$out/Trizbort.Avalonia" "$out/trizbort-recast"
              chmod +x "$out/trizbort-recast"
              Copy-Item packaging/linux/trizbort.desktop, packaging/linux/trizbort-mime.xml -Destination $out
              Copy-Item packaging/icons/trizbort-recast-256.png -Destination "$out/trizbort-recast.png"
              $name = "TrizbortRecast-$env:PACKAGE_VERSION-$rid.tar.gz"
              tar -czf $name -C $out .
            }
            $assets += $name
          }
          "assets=$($assets -join ' ')" >> $env:GITHUB_OUTPUT

      # Not yet tried for real: if it fails, the release goes out without Linux updates.
      - name: Velopack package for updates (AppImage)
        id: appimage
        if: needs.version.outputs.vpk != ''
        continue-on-error: true
        env:
          VPK_VERSION: ${{ needs.version.outputs.vpk }}
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack -u TrizbortRecast -v $env:VPK_VERSION -c linux-x64 -p publish/linux-x64 -e trizbort-recast `
            --packTitle "Trizbort Recast" --icon packaging/icons/trizbort-recast-256.png -o velopack/linux-x64
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed." }
          Get-ChildItem velopack/linux-x64

      - name: Note missing Linux updates
        if: steps.appimage.outcome == 'failure'
        run: |
          Remove-Item -Recurse -Force velopack/linux-x64 -ErrorAction SilentlyContinue
          Write-Output "::warning::Linux Velopack package failed, so this release has no Linux updates. See the step above."

      - uses: actions/download-artifact@v7
        with:
          name: macos-apps

      - uses: actions/download-artifact@v7
        if: needs.windows.result == 'success'
        with:
          name: windows-velopack
          path: velopack/win

      - uses: actions/download-artifact@v7
        if: needs.macos.outputs.velopack == 'true'
        with:
          name: macos-velopack
          path: velopack/mac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_ASSETS: ${{ steps.package.outputs.assets }}
          RELEASE_INFO: ${{ needs.version.outputs.informational }}
          RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
          PACKAGE_VERSION: ${{ needs.version.outputs.package }}
        run: |
          $macAssets = @("TrizbortRecast-$env:PACKAGE_VERSION-osx-arm64.zip", "TrizbortRecast-$env:PACKAGE_VERSION-osx-x64.zip")
          foreach ($asset in $macAssets) { if (-not (Test-Path $asset)) { throw "Missing macOS asset $asset." } }
          # Every channel's update files go in the same release, so their names must not clash
          $updates = @(if (Test-Path velopack) { Get-ChildItem velopack -Recurse -File })
          $clash = $updates | Group-Object Name | Where-Object Count -gt 1
          if ($clash) { throw "Update files share a name: $($clash.Name -join ', ')" }
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG) + ($env:RELEASE_ASSETS -split ' ') + $macAssets + ($updates | ForEach-Object FullName) + @(
            '--repo', $env:RELEASE_REPO, '--verify-tag', '--title', "Trizbort: Recast $env:RELEASE_INFO", '--generate-notes')
          # The notes: why the downloads warn (read before downloading), then the changelog's section for this
          # version (betas and full releases alike), then GitHub's list of changes
          $heading = "## [$env:RELEASE_INFO]"
          $changelog = Get-Content 'changelog.md' -Raw
          $pattern = '(?ms)^' + [regex]::Escape($heading) + '[^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $notes = [regex]::Match($changelog, $pattern)
          if (-not $notes.Success) { throw "No changelog entry found for $env:RELEASE_TAG." }
          $signing = "> **The downloads aren't signed yet**, so Windows (SmartScreen) and macOS warn about them the first " +
            "time you run them. [Why, and how you can help](https://leeoades.github.io/trizbort/signing/)."
          Set-Content 'release-notes.md' ($signing + "`n`n" + $notes.Groups[1].Value.Trim()) -Encoding utf8
          $releaseArgs += @('--notes-file', 'release-notes.md')
          if ($env:RELEASE_PRERELEASE -eq 'true') {
            $releaseArgs += @('--prerelease', '--latest=false')
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }

  # the user guide website, as it is at this release
  # The Pages environment only deploys from master, so ask for the guide's workflow on master, building this tag's guide.
  guide:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Publish the guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs-site.yml --repo "${{ github.repository }}" --ref master -f ref="${{ github.ref_name }}"
