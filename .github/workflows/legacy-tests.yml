name: Legacy regression tests

on:
  pull_request:
    paths: ['legacy/**', 'tests/manual/**', '.github/workflows/legacy-tests.yml']
  push:
    branches: ['**']
    paths: ['legacy/**', 'tests/manual/**', '.github/workflows/legacy-tests.yml']

permissions:
  contents: read

concurrency:
  group: legacy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test legacy/Trizbort.Legacy.sln -c Release --logger "trx;LogFileName=legacy.trx" --results-directory TestResults
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
