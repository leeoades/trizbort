# The user guide as a website (GitHub Pages): built from Docs/ by scripts/build-docs-site.py, which copies the pages
# to .site-build/Docs first (links out of Docs/ become GitHub links). Lee, 26 Nov 2026.
site_name: "Trizbort: Recast"
site_description: The user guide for Trizbort Recast, a map editor for interactive fiction
site_url: https://leeoades.github.io/trizbort/
docs_dir: .site-build/Docs
site_dir: .site-build/site
repo_url: https://github.com/leeoades/trizbort
repo_name: leeoades/trizbort
edit_uri: ""
copyright: Trizbort is open source, under the MIT licence.

nav:
  - Home: index.md
  - What's new: whats-new.md
  - Getting started: getting-started.md
  - A quick map: quick-map.md
  - Drawing the map: map.md
  - Labels: labels.md
  - Automap: automap.md
  - Settings: settings.md
  - Exporting: exporting.md
  - Keyboard shortcuts: keyboard.md
  - More help: more-help.md
  - Why it isn't signed: signing.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - toc: { permalink: true }
