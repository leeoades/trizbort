<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 0 48 80" width="48" height="80">
<!-- Trizbort: Recast, where you are on the map: a classic turned wooden pawn, standing on the room. -->
<defs>
<!-- turned wood: lit from the left, darker round the far side -->
<linearGradient id="turned" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a86f38"/><stop offset=".28" stop-color="#ecc58c"/><stop offset=".55" stop-color="#d29a5c"/><stop offset="1" stop-color="#8a5627"/>
</linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f3d4a3"/><stop offset="1" stop-color="#b47b44"/>
</linearGradient>
<radialGradient id="ball" cx=".36" cy=".3" r=".75">
<stop offset="0" stop-color="#fbe6c2"/><stop offset=".4" stop-color="#dcab6f"/><stop offset="1" stop-color="#8f5a29"/>
</radialGradient>
</defs>
<g stroke="#4e2f14" stroke-width="1.3" stroke-linejoin="round">
<path d="M12,69 L12,72 Q12,78 32,78 Q52,78 52,72 L52,69 Z" fill="url(#turned)"/>
<ellipse cx="32" cy="69" rx="20" ry="5.5" fill="url(#top)"/>
<path d="M21,67 C23,56 27,47 27.5,37 L36.5,37 C37,47 41,56 43,67 Q32,71 21,67 Z" fill="url(#turned)"/>
<path d="M20,36.5 Q20,33 32,33 Q44,33 44,36.5 Q44,40 32,40 Q20,40 20,36.5 Z" fill="url(#turned)"/>
<circle cx="32" cy="23" r="10" fill="url(#ball)"/>
</g>
<!-- the grain, running up the piece -->
<g fill="none" stroke="#7a4a1e" stroke-width=".6" opacity=".45">
<path d="M28,66 C29,56 30,47 30,38"/><path d="M35,66 C34.5,56 34,47 34,38"/><path d="M39,65 C37.5,57 36.5,48 36,39"/>
<path d="M17,72 Q24,74 30,73"/><path d="M36,74 Q43,74 48,72"/>
<path d="M27,17 Q25,23 28,30"/><path d="M36,15 Q39,22 36,31"/>
</g>
<ellipse cx="28.6" cy="19" rx="3" ry="2.1" fill="#fff" opacity=".5" transform="rotate(-30 28.6 19)"/>
</svg>
